<?xml version="1.0" encoding="UTF-8"?>
<!-- Ikona Stone & Clay: vesnice na úsvitu – kostel, statky a lípa nad zvlněnou krajinou. Vlastní kresba. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a3a"/>
      <stop offset="0.45" stop-color="#4d5b6a"/>
      <stop offset="0.72" stop-color="#c9a16a"/>
      <stop offset="0.86" stop-color="#e6c48a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1cf"/>
      <stop offset="0.35" stop-color="#f6d999" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6d999" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6e5e"/>
      <stop offset="1" stop-color="#46574a"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4634"/>
      <stop offset="1" stop-color="#1b2a20"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6a45"/>
      <stop offset="1" stop-color="#5a4b30"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- obloha a slunce -->
    <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
    <circle cx="330" cy="300" r="120" fill="url(#sun)"/>
    <circle cx="330" cy="300" r="34" fill="#fff4da"/>

    <!-- vzdálené kopce -->
    <path d="M0 318 C70 286 130 282 200 300 C270 318 330 292 400 284 C450 279 490 290 512 298 L512 512 L0 512 Z"
          fill="url(#hillFar)"/>
    <!-- ranní mlha v údolí -->
    <path d="M0 330 C90 318 170 326 260 334 C340 341 430 330 512 326 L512 352 L0 352 Z"
          fill="#d9d2c0" opacity="0.35"/>

    <!-- vesnice: statky a kostel -->
    <g fill="#141c17">
      <!-- statek vlevo -->
      <path d="M118 352 L118 322 L142 302 L166 322 L166 352 Z"/>
      <rect x="166" y="328" width="34" height="24"/>
      <path d="M164 330 L183 314 L202 330 Z"/>
      <!-- kostel -->
      <rect x="226" y="300" width="58" height="52"/>
      <path d="M222 304 L255 280 L288 304 Z"/>
      <rect x="282" y="262" width="26" height="90"/>
      <path d="M279 264 L295 220 L311 264 Z"/>
      <rect x="293.5" y="204" width="3" height="18"/>
      <rect x="288" y="210" width="14" height="3"/>
      <!-- statek vpravo -->
      <path d="M320 352 L320 326 L342 308 L364 326 L364 352 Z"/>
      <rect x="364" y="332" width="40" height="20"/>
      <path d="M362 334 L384 318 L406 334 Z"/>
    </g>
    <!-- okna se světlem -->
    <g fill="#f2c46b">
      <rect x="132" y="330" width="7" height="9"/>
      <rect x="148" y="330" width="7" height="9"/>
      <rect x="292" y="282" width="6" height="10" rx="3"/>
      <rect x="336" y="334" width="7" height="9"/>
    </g>

    <!-- lípa -->
    <g fill="#16231a">
      <rect x="425" y="300" width="7" height="54"/>
      <path d="M428 230 C458 232 476 258 472 284 C470 304 452 316 428 316 C404 316 386 304 384 284 C380 258 398 232 428 230 Z"/>
    </g>

    <!-- blízký kopec s poli -->
    <path d="M0 350 C90 340 180 346 260 356 C350 367 440 352 512 344 L512 512 L0 512 Z" fill="url(#hillNear)"/>
    <path d="M0 404 C120 380 250 384 380 400 C430 406 480 404 512 398 L512 512 L0 512 Z" fill="url(#field)"/>
    <!-- brázdy -->
    <g stroke="#3f331f" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M-10 438 C120 414 260 420 520 432"/>
      <path d="M-10 468 C130 446 280 452 520 466"/>
      <path d="M-10 500 C140 478 300 486 520 500"/>
    </g>
    <!-- polní cesta -->
    <path d="M256 512 C262 470 248 430 262 392 L270 392 C262 430 280 470 290 512 Z" fill="#9a8762" opacity="0.85"/>

    <!-- jemný lem dlaždice -->
    <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
</svg>
